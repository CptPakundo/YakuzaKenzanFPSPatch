      - [ load, *kenzan60_world ]
      - [ load, *kenzan60_minigame ]
      - [ load, *kenzan60_particles ]
      - [ load, *kenzan60_sound ]
      - [ load, *kenzan60_cloth ]
      - [ load, *kenzan60_clock30 ]
      - [ load, *kenzan60_fclock ]
      - [ load, *kenzan60_npctask ]
      - [ load, *kenzan60_effects ]
      - [ load, *kenzan60_effects2 ]
      - [ load, *kenzan60_misc2 ]
      - [ load, *kenzan60_t1 ]
      - [ load, *kenzan60_fades ]
      - [ load, *kenzan120_core ]
      - [ load, *kenzan120_vblank ]
      - [ load, *kenzan120_seff4 ]
  "Clean picture (English translation)":
    Games:
      "Ryu ga Gotoku Kenzan!":
        BLJM60064: [ 01.00 ]
    Author: "Pakundo"
    Notes: "Removes the blur on every frame and the grid on blurred backgrounds, and keeps edges clean at any Resolution Scale. Replaces the old optional sh_iori_ps3.par file: nothing to copy. Works with or without the frame-rate entries."
    Patch Version: 2.1
    Patch:
      - [ load, *kenzan60_image ]

