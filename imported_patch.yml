    Author: "Pakundo"
    Group: "FPS"
    Notes: "Plays the whole game at 60 FPS at its original speed. Keep RPCS3's default Vblank Rate 60. Pick this or 120 FPS, not both, and also tick Clean picture and the Minigame fixes."
