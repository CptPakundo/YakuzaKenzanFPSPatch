      - [ load, *kenzan60_misc2 ]
      - [ load, *kenzan60_logical60 ]
      - [ load, *kenzan60_t1 ]
      - [ load, *kenzan60_fades ]
  "120 FPS (English translation)":
    Games:
      "Ryu ga Gotoku Kenzan!":
        BLJM60064: [ 01.00 ]
    Author: "Pakundo"
    Group: "FPS"
    Notes: "Plays the whole game at up to 120 FPS at its original speed. Needs a custom configuration for this game: Advanced > Vblank Rate 120 and GPU > Framerate Limiter Auto. On a weaker PC, use 60 FPS instead. Pick this or 60 FPS, not both, and also tick Clean picture and the Minigame fixes."
    Patch Version: 2.1
    Patch:
      - [ load, *kenzan60core ]
      - [ load, *kenzan60_core ]
      - [ load, *kenzan60_fighter ]
      - [ load, *kenzan120f_yact ]
      - [ load, *kenzan60_camera ]
